<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="50%" stop-color="#15102a" />
      <stop offset="100%" stop-color="#06040a" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e100ff" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 800; fill: url(#titleGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #d1d5db; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; }
    
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
      100% { transform: translate(0px, 0px); }
    }

    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 25px); }
      100% { transform: translate(0px, 0px); }
    }

    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(360px); opacity: 0; }
    }

    .orb1 { animation: floatOrb1 8s ease-in-out infinite; transform-origin: center; }
    .orb2 { animation: floatOrb2 10s ease-in-out infinite; transform-origin: center; }
    .pulse { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .scanner { animation: scanline 6s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)" />

  <!-- Animated Dynamic Background Elements (Kept in Background) -->
  <g class="orb1">
    <circle cx="200" cy="100" r="180" fill="url(#glow)" />
    <circle cx="1000" cy="280" r="150" fill="url(#accentGrad)" filter="blur(20px)"/>
  </g>

  <g class="orb2">
    <circle cx="950" cy="90" r="140" fill="url(#glow)" />
    <circle cx="250" cy="270" r="120" fill="url(#accentGrad)" filter="blur(15px)"/>
  </g>

  <!-- Geometric Spatial Mesh Lines (Background Decorative) -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" fill="none">
    <polygon points="100,50 250,30 350,120 180,160" />
    <polygon points="350,120 500,80 580,190 380,220" />
    <polygon points="850,40 1020,70 1100,180 920,160" />
    <polygon points="700,180 920,160 980,300 780,280" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="8 8" />
  </g>

  <rect class="scanner" x="0" y="0" width="1200" height="2" fill="#00f2fe" opacity="0.3"/>

  <!-- Headset Wireframe Graphic (Right Side Background/Middle) -->
  <g transform="translate(820, 110)" opacity="0.25">
    <rect x="0" y="0" width="260" height="120" rx="60" fill="none" stroke="#00f2fe" stroke-width="3" class="pulse"/>
    <circle cx="70" cy="60" r="35" fill="none" stroke="#4facfe" stroke-width="2"/>
    <circle cx="190" cy="60" r="35" fill="none" stroke="#4facfe" stroke-width="2"/>
    <path d="M 105 60 Q 130 40 155 60" fill="none" stroke="#00f2fe" stroke-width="2"/>
  </g>

  <!-- Foreground Content Block (Guaranteed Clear & Readable) -->
  <g transform="translate(70, 80)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5" />
    <text x="140" y="21" text-anchor="middle" class="badge-text">🥽 AWESOME SPATIAL COMPUTING</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Mixed Reality Headset Hardware</text>
    <text x="0" y="125" class="title" style="font-size: 28px; fill: #ffffff; opacity: 0.95;">&amp; Enterprise Spatial Software</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">A curated directory of commercial headsets, AR SaaS platforms, and open-source tools</text>
    <text x="0" y="205" class="subtitle" style="font-size: 15px; fill: #9ca3af;">Updated for 2026 • Hardware Specs • SaaS Pricing • Open-Source SDKs</text>
  </g>
</svg>
